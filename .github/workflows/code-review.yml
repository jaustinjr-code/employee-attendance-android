name: Code Review

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]      

jobs:
  claude:
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Code Review
        id: claude-code-review
        uses: anthropics/claude-code-action@v1
        with:
          show_full_output: true
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback. Always post a
            summary comment on the PR, even if you have no issues to report
            (e.g. "No issues found, this looks good!").

            For issues tied to a specific file and line, call
            mcp__github_inline_comment__create_inline_comment (with
            `confirmed: true`) to leave an inline comment right on that line,
            in addition to summarizing your overall findings in the progress
            comment. Reserve the progress comment for the overview/checklist
            and anything not tied to one exact line.

            IMPORTANT: This is a single, non-interactive CI run - there is no
            later turn where you get resumed. Do not use the Task/Agent tool
            to spawn background subagents for parts of this review (e.g. one
            per review pass); their results are never collected and the run
            ends the moment you stop, even if you say you'll "wait" for them.
            Do all analysis synchronously in this conversation, and make your
            last action posting the actual review content.

          # NOTE: the `settings` input's permissions.allow list only
          # pre-approves tools that the auto-detected mode (tag/agent) already
          # exposes - it does NOT add new MCP tools to the run. To actually
          # make the PR-review tools callable, they must go through
          # claude_args' --allowedTools instead, as a single quoted value
          # (multiline claude_args splits on whitespace otherwise, breaking
          # any tool pattern containing a space - see
          # anthropics/claude-code-action#844).
          #
          # track_progress: true forces "tag" mode for every PR/issue/comment
          # event (src/modes/detector.ts), and tag mode's own system prompt
          # states it cannot submit formal GitHub PR reviews or post more
          # than its one tracking comment. So the pending-review tools
          # (create_pending_pull_request_review /
          # add_pull_request_review_comment_to_pending_review /
          # submit_pending_pull_request_review) are never usable here and are
          # deliberately left out. mcp__github_inline_comment__create_inline_comment
          # is a standalone inline comment, not part of that "formal review"
          # flow, so it still works in tag mode - see the prompt above.
          claude_args: |
            --model sonnet
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"

          # Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          # use_sticky_comment: true
          # classify_inline_comments: false
          track_progress: true
