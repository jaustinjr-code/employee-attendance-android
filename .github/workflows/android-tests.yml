name: Android Tests

# The automated gate a change must clear before it is proposed for merge. Unit tests run on the
# JVM; the instrumentation and screenshot tests run on an emulator provisioned by
# reactivecircus/android-emulator-runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_screenshots:
        description: "Record screenshot goldens instead of verifying them, and upload the result"
        type: boolean
        default: false

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: EmployeeAttendance

env:
  # Pinned emulator definition. Screenshot goldens are only reproducible against a fixed API level,
  # image target and device profile (the profile fixes screen density, which sets the pixel size of
  # every capture). Changing any of these invalidates every committed golden, so treat them as part
  # of the test contract and re-record deliberately when you bump them.
  EMULATOR_API_LEVEL: 36
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64
  EMULATOR_PROFILE: pixel_6

jobs:
  unit-tests:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload unit test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: EmployeeAttendance/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  lint:
    name: Lint
    # Blocking as of #56. The 6 pre-existing NewApi errors in
    # location/registration/AddressGeocoder.kt that forced this job to be advisory are fixed, so a
    # lint error is now a real regression and should fail the run. Keep it that way: if a new error
    # appears, fix it rather than reinstating continue-on-error.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: EmployeeAttendance/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  instrumentation-tests:
    name: Instrumentation + screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # The emulator needs hardware acceleration to be usable; without this it either refuses to
      # start or runs far too slowly to finish inside the job timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-${{ env.EMULATOR_TARGET }}-${{ env.EMULATOR_ARCH }}-${{ env.EMULATOR_PROFILE }}

      # Creating the AVD once and snapshotting it makes later runs boot from the snapshot instead of
      # cold-booting, which is the bulk of the job's runtime.
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          profile: ${{ env.EMULATOR_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: EmployeeAttendance
          # MUST stay a single line. android-emulator-runner splits `script` on newlines and runs
          # each line through its own `sh -c`, so multi-line shell control flow is torn apart — an
          # `if ...; then` block failed here with "Syntax error: end of file unexpected" before
          # Gradle was ever invoked (#54). Let the GitHub expression, not the shell, pick the flag.
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace ${{ github.event.inputs.record_screenshots == 'true' && '-Pandroid.testInstrumentationRunnerArguments.screenshot_record=true' || '' }}

      - name: Upload instrumentation test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-report
          path: EmployeeAttendance/app/build/reports/androidTests/connected/
          if-no-files-found: ignore

      # On a screenshot failure this holds the actual render and a diff image; in record mode it
      # holds the new goldens, ready to be copied into app/src/androidTest/assets/screenshots/.
      - name: Upload screenshot output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-output
          path: EmployeeAttendance/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: ignore
